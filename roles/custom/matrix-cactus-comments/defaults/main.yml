---
# Cactus Comments is a federated comment system built on Matrix.
# This role installs the backend appservice.
# Project source code URL: https://gitlab.com/cactus-comments/cactus-appservice

matrix_cactus_comments_enabled: true

matrix_cactus_comments_container_image_self_build: false

matrix_cactus_comments_container_repo: "https://gitlab.com/cactus-comments/cactus-appservice.git"
matrix_cactus_comments_container_repo_version: "{{ matrix_cactus_comments_version if matrix_cactus_comments_version != 'latest' else 'main' }}"
matrix_cactus_comments_container_src_files_path: "{{ matrix_cactus_comments_base_path }}/docker-src"

matrix_cactus_comments_base_path: "{{ matrix_base_data_path }}/cactus-comments"
matrix_cactus_comments_container_tmp_path: "{{ matrix_cactus_comments_base_path }}/tmp"

matrix_cactus_comments_app_service_config_file: "{{ matrix_cactus_comments_base_path }}/cactus_appservice.yaml"
matrix_cactus_comments_app_service_env_file: "{{ matrix_cactus_comments_base_path }}/cactus.env"

matrix_cactus_comments_as_token: ''
matrix_cactus_comments_hs_token: ''
matrix_cactus_comments_homeserver_url: ''
matrix_cactus_comments_user_id: "bot.cactusbot"
matrix_cactus_comments_tmp_directory_size_mb: 1

matrix_cactus_comments_container_port: 5000

# renovate: datasource=docker depName=cactuscomments/cactus-appservice
matrix_cactus_comments_version: 0.9.0
matrix_cactus_comments_container_image: "{{ matrix_cactus_comments_container_image_registry_prefix }}cactuscomments/cactus-appservice:{{ matrix_cactus_comments_container_image_tag }}"
matrix_cactus_comments_container_image_registry_prefix: "{{ 'localhost/' if matrix_cactus_comments_container_image_self_build else matrix_cactus_comments_container_image_registry_prefix_upstream }}"
matrix_cactus_comments_container_image_registry_prefix_upstream: "{{ matrix_cactus_comments_container_image_registry_prefix_upstream_default }}"
matrix_cactus_comments_container_image_registry_prefix_upstream_default: docker.io/
matrix_cactus_comments_container_image_tag: "{{ matrix_cactus_comments_version }}"

matrix_cactus_comments_container_network: ""

matrix_cactus_comments_container_additional_networks: "{{ matrix_cactus_comments_container_additional_networks_auto + matrix_cactus_comments_container_additional_networks_custom }}"
matrix_cactus_comments_container_additional_networks_auto: []
matrix_cactus_comments_container_additional_networks_custom: []

# A list of extra arguments to pass to the container
matrix_cactus_comments_container_extra_arguments: []

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
matrix_cactus_comments_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
matrix_cactus_comments_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
matrix_cactus_comments_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ matrix_cactus_comments_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ devture_systemd_docker_base_container_stop_grace_time_seconds }} matrix-cactus-comments >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f matrix-cactus-comments >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect matrix-cactus-comments >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ matrix_cactus_comments_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up matrix-cactus-comments" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container matrix-cactus-comments after {{ matrix_cactus_comments_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# List of systemd services that matrix-cactus-comments.service depends on
matrix_cactus_comments_systemd_required_services_list: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"

# List of systemd services that matrix-cactus-comments.service wants
matrix_cactus_comments_systemd_wanted_services_list: []

matrix_cactus_comments_environment_variables_extension: ''

# matrix_cactus_comments_restart_necessary controls whether the service
# will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
matrix_cactus_comments_restart_necessary: false
