---

- name: Check existence of matrix-mautrix-linkedin service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-mautrix-linkedin.service"
  register: matrix_bridge_mautrix_linkedin_service_stat

- when: matrix_bridge_mautrix_linkedin_service_stat.stat.exists | bool
  block:
    - name: Ensure matrix-mautrix-linkedin is stopped
      ansible.builtin.service:
        name: matrix-mautrix-linkedin
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure matrix-mautrix-linkedin.service doesn't exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-mautrix-linkedin.service"
        state: absent
