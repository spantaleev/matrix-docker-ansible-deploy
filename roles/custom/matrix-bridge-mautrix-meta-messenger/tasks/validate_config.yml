---

- name: Fail if required mautrix-meta-messenger settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - {'name': 'matrix_bridge_mautrix_meta_messenger_appservice_token', when: true}
    - {'name': 'matrix_bridge_mautrix_meta_messenger_homeserver_token', when: true}
    - {'name': 'matrix_bridge_mautrix_meta_messenger_container_network', when: true}
    - {'name': 'matrix_bridge_mautrix_meta_messenger_homeserver_address', when: true}
    - {'name': 'matrix_bridge_mautrix_meta_messenger_database_hostname', when: "{{ matrix_bridge_mautrix_meta_messenger_database_engine == 'postgres' }}"}
    - {'name': 'matrix_bridge_mautrix_meta_messenger_database_password', when: "{{ matrix_bridge_mautrix_meta_messenger_database_engine == 'postgres' }}"}

- name: (Deprecation) Catch and report renamed mautrix-meta-messenger variables
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please rename the variable (`{{ item.old }}` -> `{{ item.new }}`) on your configuration file (vars.yml).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - {'old': 'matrix_bridge_mautrix_meta_messenger_bridge_login_shared_secret', 'new': '<removed>'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_bridge_login_shared_secret_map_custom', 'new': '<superseded by matrix_bridge_mautrix_meta_messenger_double_puppet_secrets_custom>'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_bridge_management_room_text_welcome', 'new': '<removed>'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_image_name_prefix', 'new': 'matrix_bridge_mautrix_meta_messenger_container_image_registry_prefix'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_image_force_pull', 'new': '<removed> (the new community.docker.docker_image_pull module handles this natively)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_metrics_enabled', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_metrics_proxying_enabled', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_metrics_proxying_hostname', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_metrics_proxying_path_prefix', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_enabled', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_traefik_rule', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_traefik_priority', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_traefik_entrypoints', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_traefik_tls', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_traefik_tls_certResolver', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_middleware_basic_auth_enabled', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_container_labels_metrics_middleware_basic_auth_users', 'new': '<removed> (mautrix-meta-messenger does not support metrics)'}
    - {'old': 'matrix_bridge_mautrix_meta_messenger_meta_ig_e2ee', 'new': '<removed> (mautrix-meta no longer has an `ig_e2ee` configuration option)'}
