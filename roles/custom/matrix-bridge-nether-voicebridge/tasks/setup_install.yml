---

- name: Ensure Nether Voice Bridge image is pulled
  community.docker.docker_image_pull:
    name: "{{ matrix_nether_voicebridge_container_image }}"
    pull: always
  when: not matrix_nether_voicebridge_container_image_self_build | bool
  register: matrix_nether_voicebridge_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_nether_voicebridge_container_image_pull_result is not failed

- name: Ensure Nether Voice Bridge paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  with_items:
    - {path: "{{ matrix_nether_voicebridge_base_path }}", when: true}
    - {path: "{{ matrix_nether_voicebridge_config_path }}", when: true}
    - {path: "{{ matrix_nether_voicebridge_data_path }}", when: true}
    - {path: "{{ matrix_nether_voicebridge_container_src_files_path }}", when: "{{ matrix_nether_voicebridge_container_image_self_build }}"}
  when: item.when | bool

- name: Ensure Nether Voice Bridge repository is present on self-build
  ansible.builtin.git:
    repo: "{{ matrix_nether_voicebridge_container_image_self_build_repo }}"
    version: "{{ matrix_nether_voicebridge_container_image_self_build_repo_version }}"
    dest: "{{ matrix_nether_voicebridge_container_src_files_path }}"
    force: "yes"
  become: true
  become_user: "{{ matrix_user_name }}"
  register: matrix_nether_voicebridge_git_pull_results
  when: matrix_nether_voicebridge_container_image_self_build | bool

- name: Ensure Nether Voice Bridge Docker image is built
  community.docker.docker_image_build:
    name: "{{ matrix_nether_voicebridge_container_image }}"
    dockerfile: Dockerfile
    path: "{{ matrix_nether_voicebridge_container_src_files_path }}"
    pull: true
    rebuild: "{{ 'always' if matrix_nether_voicebridge_git_pull_results.changed | bool else 'never' }}"
  when: matrix_nether_voicebridge_container_image_self_build | bool
  register: matrix_nether_voicebridge_container_image_build_result

- name: Ensure matrix-nether-voicebridge config.toml installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/config.toml.j2"
    dest: "{{ matrix_nether_voicebridge_config_path }}/config.toml"
    mode: '0640'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  register: matrix_nether_voicebridge_config_result

- name: Ensure matrix-nether-voicebridge registration.yaml installed
  ansible.builtin.copy:
    content: "{{ matrix_nether_voicebridge_registration | to_nice_yaml(indent=2, width=999999) }}"
    dest: "{{ matrix_nether_voicebridge_config_path }}/registration.yaml"
    mode: '0644'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  register: matrix_nether_voicebridge_registration_result

- name: Ensure matrix-nether-voicebridge container network is created
  when: matrix_nether_voicebridge_container_network != 'host'
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ matrix_nether_voicebridge_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure matrix-nether-voicebridge.service installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/matrix-nether-voicebridge.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/matrix-nether-voicebridge.service"
    mode: '0644'
  register: matrix_nether_voicebridge_systemd_service_result

- name: Determine whether matrix-nether-voicebridge needs a restart
  ansible.builtin.set_fact:
    matrix_nether_voicebridge_restart_necessary: >-
      {{
        matrix_nether_voicebridge_config_result.changed | default(false)
        or matrix_nether_voicebridge_registration_result.changed | default(false)
        or matrix_nether_voicebridge_systemd_service_result.changed | default(false)
        or matrix_nether_voicebridge_container_image_pull_result.changed | default(false)
        or matrix_nether_voicebridge_container_image_build_result.changed | default(false)
      }}
