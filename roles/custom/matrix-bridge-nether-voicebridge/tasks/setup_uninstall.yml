---

- name: Check existence of matrix-nether-voicebridge service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-nether-voicebridge.service"
  register: matrix_nether_voicebridge_service_stat

- when: matrix_nether_voicebridge_service_stat.stat.exists | bool
  block:
    - name: Ensure matrix-nether-voicebridge is stopped
      ansible.builtin.service:
        name: matrix-nether-voicebridge
        state: stopped
        daemon_reload: true

    - name: Ensure matrix-nether-voicebridge.service doesn't exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-nether-voicebridge.service"
        state: absent
