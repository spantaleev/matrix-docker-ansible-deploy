---
- name: Prepare matrix-bot-honoroit Molecule tests
  hosts: all
  become: true
  vars_files:
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/vars.yml"
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/playbook-context.yml"
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure required packages are installed
      ansible.builtin.package:
        name:
          - python3-requests
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: fuse-overlayfs

    - name: Ensure the matrix group exists
      ansible.builtin.group:
        name: "{{ matrix_group_name }}"
        gid: "{{ matrix_user_gid }}"
        state: present

    - name: Ensure the matrix user exists
      ansible.builtin.user:
        name: "{{ matrix_user_name }}"
        uid: "{{ matrix_user_uid }}"
        group: "{{ matrix_group_name }}"
        create_home: false
        system: true
        state: present

    - name: Ensure the base data path exists
      ansible.builtin.file:
        path: "{{ matrix_base_data_path }}"
        state: directory
        owner: "{{ matrix_user_name }}"
        group: "{{ matrix_group_name }}"
        mode: "0750"

    - name: Ensure Honoroit's container networks exist
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - "{{ item }}"
      loop: "{{ [matrix_bot_honoroit_container_network] + matrix_bot_honoroit_container_additional_networks }}"
      register: matrix_bot_honoroit_molecule_networks
      changed_when: matrix_bot_honoroit_molecule_networks.rc == 0
      failed_when:
        - matrix_bot_honoroit_molecule_networks.rc != 0
        - "'already exists' not in matrix_bot_honoroit_molecule_networks.stderr"

    - name: Ensure Postgres is running
      ansible.builtin.include_tasks:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/tasks/postgres.yml"
      vars:
        molecule_shared_postgres_network: "{{ matrix_bot_honoroit_container_network }}"
        molecule_shared_postgres_database: "{{ matrix_bot_honoroit_database_name }}"
        molecule_shared_postgres_username: "{{ matrix_bot_honoroit_database_username }}"
        molecule_shared_postgres_password: "{{ matrix_bot_honoroit_database_password }}"

    - name: Ensure the homeserver stub is running
      ansible.builtin.include_tasks:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/tasks/homeserver-stub.yml"
      vars:
        molecule_shared_stub_network: "{{ matrix_bot_honoroit_container_network }}"
        molecule_shared_stub_server_name: molecule.local
        molecule_shared_stub_user_id: "@{{ matrix_bot_honoroit_login }}:molecule.local"
        molecule_shared_stub_joined_rooms:
          - "{{ matrix_bot_honoroit_roomid }}"
