---
- name: Prepare mautrix-telegram Molecule tests
  hosts: all
  become: true
  vars_files:
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/vars.yml"
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/playbook-context.yml"
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_os_family == 'Debian'

    - name: Ensure required packages are installed
      ansible.builtin.package:
        name:
          - python3-requests
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: fuse-overlayfs

    # The role's file tasks resolve the owner/group by name. matrix-base creates them
    # in a full playbook run, so the scenario supplies that small piece of context.
    - name: Ensure the matrix group exists
      ansible.builtin.group:
        name: "{{ matrix_group_name }}"
        gid: "{{ matrix_user_gid }}"
        state: present

    - name: Ensure the matrix user exists
      ansible.builtin.user:
        name: "{{ matrix_user_name }}"
        uid: "{{ matrix_user_uid }}"
        group: "{{ matrix_group_name }}"
        create_home: false
        system: true
        state: present

    - name: Ensure the base data path exists
      ansible.builtin.file:
        path: "{{ matrix_base_data_path }}"
        state: directory
        owner: "{{ matrix_user_name }}"
        group: "{{ matrix_group_name }}"
        mode: "0750"

    # The dependencies must attach before converge asks the role to create the same network.
    - name: Ensure the container network the role attaches to exists
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - "{{ matrix_bridge_mautrix_telegram_container_network }}"
      register: mautrix_telegram_molecule_network
      changed_when: mautrix_telegram_molecule_network.rc == 0
      failed_when:
        - mautrix_telegram_molecule_network.rc != 0
        - "'already exists' not in mautrix_telegram_molecule_network.stderr"

    - name: Ensure Postgres is running
      ansible.builtin.include_tasks:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/tasks/postgres.yml"
      vars:
        molecule_shared_postgres_network: "{{ matrix_bridge_mautrix_telegram_container_network }}"
        molecule_shared_postgres_database: "{{ matrix_bridge_mautrix_telegram_database_name }}"
        molecule_shared_postgres_username: "{{ matrix_bridge_mautrix_telegram_database_username }}"
        molecule_shared_postgres_password: "{{ matrix_bridge_mautrix_telegram_database_password }}"

    # The bridge calls /whoami before opening its appservice listener. This proves the
    # Matrix-side startup only; no Telegram login or real external credential is involved.
    - name: Ensure the homeserver stub is running
      ansible.builtin.include_tasks:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../../molecule-shared/tasks/homeserver-stub.yml"
      vars:
        molecule_shared_stub_network: "{{ matrix_bridge_mautrix_telegram_container_network }}"
        molecule_shared_stub_server_name: "{{ matrix_bridge_mautrix_telegram_homeserver_domain }}"
        molecule_shared_stub_user_id: "@{{ matrix_bridge_mautrix_telegram_appservice_bot_username }}:{{ matrix_bridge_mautrix_telegram_homeserver_domain }}"
