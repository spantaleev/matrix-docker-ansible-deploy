---
name: Privilege escalation checks

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    paths:
      - setup.yml
      - jitsi_jvb.yml
      - examples/hosts
      - bin/test-privilege-escalation.py
      - .github/workflows/privilege-escalation.yml
  pull_request:
    paths:
      - setup.yml
      - jitsi_jvb.yml
      - examples/hosts
      - bin/test-privilege-escalation.py
      - .github/workflows/privilege-escalation.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: 2.15.13
            python: '3.11'
          - core: 2.21.3
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install 'ansible-core==${{ matrix.core }}'
      - name: Check privilege escalation validation
        run: python bin/test-privilege-escalation.py
